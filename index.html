<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore the Performance Page Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --navy:#211e60; --accent:#4146e0; --ring:#ffffff; --ring-soft:#6f75ff;
    --bg:#f4f5fb; --surface:#ffffff; --line:#dcdfee; --ink:#211e60; --ink-2:#4a4a68; --ink-3:#6b6b8a;
    --soft:#eceefa; --soft-line:#cfd3ea; --stage:#e4e6f2; --label:#6b6b8a;
    --shadow:0 10px 30px rgba(33,30,96,.18);
    --crit-bg:#faece7; --crit-line:#d85a30; --crit-ink:#712b13;
    --good-bg:#e8f4ea; --good-line:#2f8f4e; --good-ink:#1d5a31;
    --gap-bg:#eeeeec; --gap-line:#888780; --gap-ink:#444441;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  .app{height:100%;height:100dvh}
  body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);background-color:var(--bg)}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .app{display:flex;flex-direction:column}
  .progress{height:4px;background:var(--line);flex:none}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
  .topbar{flex:none;display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--surface);color:var(--navy);border-bottom:1px solid var(--line)}
  .topbar b{font-size:15px;font-weight:700}
  .topbar span{font-size:13px;color:var(--ink-3)}

  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 420px}
  .stage{min-height:0;background:var(--stage);overflow:auto;padding:20px 24px;scroll-behavior:smooth}
  .shot{position:relative;width:100%;max-width:1870px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
  .shot img{display:block;width:100%;height:auto;user-select:none}
  .layer{position:absolute;inset:0}
  .spot{position:absolute;border-radius:8px;pointer-events:none;box-shadow:0 0 0 3px var(--accent),0 0 0 7px var(--ring),0 0 0 3000px rgba(33,30,96,.4);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease,opacity .25s}
  .spot.off{opacity:0}
  .ring{position:absolute;border-radius:8px;pointer-events:none;border:2px dashed var(--ring-soft);transition:all .3s ease}
  .hs{position:absolute;background:transparent;border:2px solid transparent;border-radius:8px}
  .hs:hover{border-color:var(--accent);background:rgba(38,33,92,.06)}
  .hs.on-overview{border-color:rgba(38,33,92,.45);background:rgba(38,33,92,.04)}
  .pin{position:absolute;translate:-100% 0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;border:2px solid #fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(38,33,92,.4);transition:transform .2s,background .2s}
  .pin.current{background:var(--accent);border-color:var(--ring);transform:scale(1.2)}
  .pin.dim{opacity:.55}

  .guide{min-height:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
  .guide-body{flex:1;min-height:0;overflow:auto;padding:26px 28px 12px}
  .tag{display:inline-block;background:var(--soft);color:var(--accent);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:14px}
  h1{font-size:26px;line-height:1.2;font-weight:700;margin-bottom:12px;color:var(--ink)}
  .lede{font-size:15px;line-height:1.65;font-weight:500;color:var(--ink-2);margin-bottom:16px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:12px;font-weight:700;color:var(--label);margin-bottom:6px}
  .card p{font-size:14px;line-height:1.6;color:var(--ink-2)}
  .parts{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
  .chip{border:1px solid var(--soft-line);background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;transition:background .15s}
  .chip:hover{background:var(--soft)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .part-text{font-size:14px;line-height:1.6;color:var(--ink-2);background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .callout{border-left:4px solid var(--accent);background:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:14px 18px;font-size:14px;line-height:1.6;color:var(--ink-2);margin-top:4px}
  .callout.good{background:var(--good-bg);box-shadow:none;border-left-color:var(--good-line);color:var(--good-ink)}
  .callout.warn{background:var(--crit-bg);box-shadow:none;border-left-color:var(--crit-line);color:var(--crit-ink)}
  .callout.gap{background:var(--gap-bg);box-shadow:none;border-left-color:var(--gap-line);color:var(--gap-ink)}
  .callout b{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink)}
  .daily{padding-left:0;list-style:none;counter-reset:d}
  .daily li{font-size:14px;line-height:1.55;color:var(--ink-2);padding-left:28px;position:relative;margin-bottom:8px;counter-increment:d}
  .daily li::before{content:counter(d);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

  .nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 28px;border-top:1px solid var(--line);background:var(--surface)}
  .btn{background:transparent;border:1px solid var(--soft-line);color:var(--ink-2);padding:8px 18px;border-radius:8px;font-size:14px;font-weight:500;transition:background .15s}
  .btn:hover:not(:disabled){background:var(--soft)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover:not(:disabled){background:var(--accent)}
  .dots{display:flex;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--soft-line);transition:background .2s,transform .2s}
  .dot[aria-current="step"]{background:var(--accent);transform:scale(1.35)}

  @media (max-width: 1200px){
    .main{grid-template-columns:minmax(0,1fr) 360px}
    .guide-body{padding:22px 22px 10px}
    h1{font-size:24px}
  }
  @media (max-width: 900px){
    .main{grid-template-columns:1fr;grid-template-rows:minmax(0,42%) minmax(0,58%)}
    .guide{border-left:0;border-top:1px solid var(--line)}
    .stage{padding:10px}
    .guide-body{padding:16px 18px 8px}
    .topbar,.nav{padding-left:18px;padding-right:18px}
    .topbar{padding-top:9px;padding-bottom:9px}
    .nav{padding-top:10px;padding-bottom:10px}
    .lede{font-size:14px;margin-bottom:12px}
    .chip{padding:9px 14px}
  }
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 560px){
    .main{grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:none}
    .guide{border-left:1px solid var(--line);border-top:0}
    h1{font-size:20px;margin-bottom:8px}
    .tag{margin-bottom:8px}
    .card{padding:10px 12px;margin-bottom:8px}
    .topbar span{display:none}
  }
  @media (max-height: 560px){
    .topbar{padding-top:6px;padding-bottom:6px}
    .nav{padding-top:8px;padding-bottom:8px}
    .btn{padding:6px 14px}
  }
  @media (max-width: 480px){
    .topbar span{display:none}
    .dots{display:none}
    .nav{gap:12px}
    .btn{flex:1;padding:10px 14px}
    h1{font-size:21px}
    .tag{font-size:11px}
    .pin{width:22px;height:22px;font-size:11px}
  }
  @media (prefers-reduced-motion: reduce){ .stage{scroll-behavior:auto} *{transition:none!important} }

  /* ===== Larger notes for embedding (360Learning / Genially) =====
     Adjust the sizes below to scale the whole side panel. */
  .main{grid-template-columns:minmax(0,1fr) clamp(440px,38vw,560px)}
  .guide{min-width:0;overflow:hidden}
  .topbar b{font-size:18px}
  .topbar span{font-size:15px}
  .guide-body{padding:28px 32px 16px}
  .tag{font-size:15px;padding:6px 16px;margin-bottom:16px}
  h1{font-size:36px;line-height:1.15;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.55;margin-bottom:20px}
  .card{padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:15px;letter-spacing:.02em;margin-bottom:8px}
  .card p{font-size:19px;line-height:1.55}
  .parts{gap:10px;margin:4px 0 14px}
  .chip{font-size:18px;padding:11px 20px;min-height:46px}
  .part-text{font-size:19px;line-height:1.55;padding:16px 18px;margin-bottom:14px}
  .callout{font-size:19px;line-height:1.55;padding:18px 22px}
  .callout b{font-size:15px;margin-bottom:6px}
  .daily li{font-size:19px;line-height:1.5;padding-left:40px;margin-bottom:12px}
  .daily li::before{width:28px;height:28px;font-size:15px;top:0}
  .nav{padding:16px 32px;gap:14px}
  .btn{font-size:19px;font-weight:600;padding:13px 28px;min-height:50px;border-radius:10px}
  .dots{gap:10px}
  .dot{width:14px;height:14px}
  .pin{width:36px;height:36px;font-size:16px}

  @media (max-width: 1200px){
    .main{grid-template-columns:minmax(0,1fr) clamp(420px,42vw,520px)}
    .guide-body{padding:24px 26px 12px}
    h1{font-size:32px}
    .lede{font-size:20px}
    .card p,.part-text,.callout,.daily li{font-size:18px}
    .nav{padding:14px 26px}
    .dots{display:none}
    .btn{flex:1}
  }
  @media (max-width: 900px){
    .main{grid-template-columns:1fr;grid-template-rows:minmax(0,36%) minmax(0,64%)}
    .guide-body{padding:20px 22px 10px}
    .lede{font-size:19px}
    .chip{padding:12px 18px}
    .nav{padding:12px 22px}
    .dots{display:none}
    .btn{flex:1}
  }
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 560px){
    .main{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:none}
    h1{font-size:26px;margin-bottom:10px}
    .lede{font-size:18px}
    .card{padding:12px 14px;margin-bottom:10px}
    .card p,.part-text,.callout,.daily li{font-size:17px}
    .btn{font-size:17px;padding:10px 22px;min-height:44px}
  }
  @media (max-width: 480px){
    h1{font-size:27px}
    .tag{font-size:14px}
    .pin{width:28px;height:28px;font-size:13px}
  }

  /* ===== Opportunity walkthrough additions ===== */
  .notice{margin:2px 0 0;padding-left:26px}
  .notice li{font-size:19px;line-height:1.5;color:var(--ink-2);margin-bottom:12px}
  .notice li:last-child{margin-bottom:0}
  .part-text .line{display:block;margin-top:10px;font-weight:700;color:var(--navy)}
  .foot{font-size:16px;color:var(--ink-3);margin-top:4px}
  .dots{gap:6px}
  .dot{width:11px;height:11px}
  @media (max-width: 1200px){ .notice li{font-size:18px} }
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 560px){ .notice li{font-size:17px} }
</style>
</head>
<body>
<div class="app">
  <div class="progress" aria-hidden="true"><i id="fill"></i></div>
  <div class="topbar"><b>Explore the Performance Page</b><span>Interactive walkthrough</span></div>
  <div class="main">
    <div class="stage" id="stage">
      <div class="shot" id="shot">
        <img id="pic" alt="Performance page in MomentusMAX showing health metrics, new opportunities, stage charts, active holds, and a team leaderboard" decoding="async">
        <div class="layer" id="layer"></div>
      </div>
    </div>
    <section class="guide" aria-live="polite">
      <div class="guide-body" id="guide"></div>
      <div class="nav">
        <button class="btn" id="back">Back</button>
        <div class="dots" id="dots" role="group" aria-label="Walkthrough steps"></div>
        <button class="btn primary" id="next">Next</button>
      </div>
    </section>
  </div>
</div>

const HOT = [{"rect": [40, 72, 208, 38], "pin": [300, 74], "step": 1}, {"rect": [36, 122, 525, 62], "pin": [720, 132], "step": 2}, {"rect": [41, 201, 1573, 452], "pin": [1604, 205], "step": 3}, {"rect": [41, 667, 1557, 673], "pin": [1590, 672], "step": 4}, {"rect": [41, 1350, 1573, 497], "pin": [1604, 1356], "step": 5}, {"rect": [41, 1870, 1573, 818], "pin": [1604, 1876], "step": 6}, {"rect": [41, 2700, 1573, 404], "pin": [1604, 2706], "step": 7}];
const STEPS = [{"img": 0, "tag": "Overview", "title": "Explore the Performance page", "what": "See how you and your team are doing at a glance.", "todo": "Select a numbered area on the screen, or use Next.", "learn": ["Read your health metrics", "Follow new opportunities and holds", "Check how deals move through stages", "Switch to the team view"], "learnTitle": "What you will learn", "foot": "Examples are illustrative."}, {"img": 0, "tag": "Rep and Manager views", "title": "Rep and Manager views", "what": "Choose who you are looking at.", "target": [40, 72, 208, 38], "parts": [{"label": "Rep View", "img": 0, "text": "Your own numbers.", "rect": [40, 72, 208, 38]}, {"label": "Manager View", "img": 3, "text": "Charts that compare the whole team.", "rect": [40, 72, 208, 38]}]}, {"img": 2, "tag": "Event type", "title": "Event type", "what": "Look at one kind of event at a time.", "target": [36, 120, 525, 405], "notice": ["Choose one or more event types", "Search the list", "Numbers show how many of each"]}, {"img": 0, "tag": "Health metrics", "title": "Health metrics", "what": "Your key numbers, compared with the last period.", "target": [41, 201, 1573, 452], "notice": ["Pipeline revenue and opportunities", "Average deal size, yours and the team’s", "Lead response time in hours"], "parts": [{"label": "Monthly", "img": 0, "rect": [58, 262, 308, 40], "text": "Compares with the prior month."}, {"label": "Yearly", "img": 1, "rect": [58, 262, 308, 40], "text": "Compares with the prior year."}]}, {"img": 0, "tag": "New opportunities", "title": "New opportunities", "what": "New opportunities over time.", "target": [41, 667, 1557, 673], "parts": [{"label": "Time range", "rect": [70, 780, 880, 42], "text": "Choose Last 7 Days, 30 Days, 90 Days, or 12 Months."}, {"label": "Group by Event Type", "rect": [68, 722, 330, 36], "text": "Turn it on to split the chart by event type."}]}, {"img": 0, "tag": "Stage charts", "title": "Stage charts", "what": "How opportunities move through your stages.", "target": [41, 1350, 1573, 497], "parts": [{"label": "Conversion rate", "rect": [58, 1365, 518, 480], "text": "The share that moves on from each stage."}, {"label": "Touchpoints", "rect": [569, 1365, 520, 480], "text": "The average number of touchpoints at each stage."}, {"label": "Pipeline age", "rect": [1085, 1365, 520, 480], "text": "How long opportunities have been in the pipeline, by stage."}]}, {"img": 0, "tag": "Active holds", "title": "Active holds", "what": "Holds that are still open.", "target": [41, 1870, 1573, 818], "parts": [{"label": "Hold value and count", "rect": [58, 1930, 762, 259], "text": "The estimated value and number of active holds."}, {"label": "Hold to won", "rect": [836, 1930, 762, 259], "text": "How many holds became won deals. Choose 30 days, 90 days, or QTD."}, {"label": "Aging holds", "rect": [58, 2224, 870, 414], "text": "Holds open longer than 2 weeks or 4 weeks."}]}, {"img": 0, "tag": "Leaderboard", "title": "Team leaderboard", "what": "See how reps rank.", "target": [41, 2700, 1573, 404], "notice": ["Choose This Week, This Month, This Quarter, or This Year", "The top 3 reps are listed by rank", "Your own rank shows at the bottom"]}, {"img": 3, "tag": "Manager View", "title": "Manager View", "what": "Compare reps across the team.", "target": [38, 118, 1580, 650], "parts": [{"label": "Filters", "rect": [38, 118, 1580, 80], "text": "Choose Monthly or Yearly. Filter by rep or event type."}, {"label": "Total pipeline", "rect": [58, 266, 766, 495], "text": "Active pipeline for each rep. Closed and not qualified deals are left out."}, {"label": "New deals", "rect": [836, 266, 766, 498], "text": "New opportunities and their value for each rep."}]}];
const imgEl = document.getElementById('pic'), shot = document.getElementById('shot'), layer = document.getElementById('layer'),
      stage = document.getElementById('stage'), guide = document.getElementById('guide'),
      dotsEl = document.getElementById('dots'), fill = document.getElementById('fill'),
      back = document.getElementById('back'), next = document.getElementById('next');
let W = IMGS[0].w, H = IMGS[0].h;
const pct = (v,t)=> (v/t*100)+'%';
function place(el, [x,y,w,h]){ el.style.left=pct(x,W); el.style.top=pct(y,H); el.style.width=pct(w,W); el.style.height=pct(h,H); }

const spot = document.createElement('div'); spot.className='spot off';
const ring = document.createElement('div'); ring.className='ring'; ring.style.opacity=0;
layer.append(spot, ring);
const hsEls = [], pinEls = [];
HOT.forEach((h,i)=>{
  const b = document.createElement('button'); b.className='hs'; b.setAttribute('aria-label','Go to '+STEPS[h.step].title);
  place(b,h.rect); b.onclick=()=>go(h.step); layer.append(b); hsEls.push(b);
  const p = document.createElement('div'); p.className='pin'; p.textContent=i+1;
  p.style.left=pct(h.pin[0],W); p.style.top=pct(h.pin[1],H); layer.append(p); pinEls.push(p);
});
STEPS.forEach((s,i)=>{ const d=document.createElement('button'); d.className='dot'; d.setAttribute('aria-label','Step '+(i+1)+': '+s.title); d.onclick=()=>go(i); dotsEl.append(d); });

let cur = 0, sel = -1, curTarget = null, zoomRect = null, shownImg = -1;
function fit(){
  const s = STEPS[cur], zoomed = cur!==0;
  const cs = getComputedStyle(stage);
  const inner = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (zoomed && zoomRect){
    const scale = Math.min(1, Math.max(inner/(zoomRect[2]+40), inner/W));
    shot.style.width = Math.round(W*scale)+'px';
  } else shot.style.width = '100%';
  if (curTarget){
    const sc = shot.clientWidth / W;
    const midX = (curTarget[0] + curTarget[2]/2) * sc + shot.offsetLeft;
    const top = sel>=0 ? ((curTarget[1] + curTarget[3]/2) * sc + shot.offsetTop - stage.clientHeight/2)
                       : ((curTarget[1] - 140) * sc + shot.offsetTop);
    stage.scrollTo({top: Math.max(0, top), left: Math.max(0, midX - stage.clientWidth/2)});
  } else stage.scrollTo({top:0,left:0});
}
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function render(){
  const s = STEPS[cur];
  const imIdx = (sel>=0 && s.parts && s.parts[sel].img!=null) ? s.parts[sel].img : s.img;
  W = IMGS[imIdx].w; H = IMGS[imIdx].h;
  if (shownImg !== imIdx){ imgEl.src = IMGS[imIdx].src; imgEl.width = W; imgEl.height = H; shownImg = imIdx; }
  let h = `<span class="tag">${cur+1} of ${STEPS.length} \u00b7 ${esc(s.tag)}</span><h1>${esc(s.title)}</h1>`;
  h += `<p class="lede">${esc(s.what)}</p>`;
  if (s.todo) h += `<div class="card"><h2>What to do</h2><p>${esc(s.todo)}</p></div>`;
  if (s.learn) h += `<div class="card"><h2>${esc(s.learnTitle)}</h2><ul class="notice">${s.learn.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;
  if (s.notice) h += `<div class="card"><h2>Look for</h2><ul class="notice">${s.notice.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;
  if (s.parts){
    h += `<div class="card"><h2>Take a closer look</h2><div class="parts">` +
      s.parts.map((p,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===sel}">${esc(p.label)}</button>`).join('') +
      `</div><div id="partText" class="part-text" ${sel<0?'hidden':''}>${sel>=0?esc(s.parts[sel].text):''}</div>` +
      (sel<0?`<p>Select a label to see where it is on the screen.</p>`:'') + `</div>`;
  }
  if (s.foot) h += `<p class="foot">${esc(s.foot)}</p>`;
  guide.innerHTML = h; guide.scrollTop = 0;
  guide.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const i=+c.dataset.i; sel = (sel===i)?-1:i; render(); });

  const onA = imIdx<=2;
  hsEls.forEach((b,i)=>{ b.style.display = onA ? '' : 'none'; b.classList.toggle('on-overview', cur===0); });
  pinEls.forEach((p,i)=>{ p.style.display = (onA && (cur===0 || HOT[i].step===cur)) ? '' : 'none'; p.classList.toggle('current', HOT[i].step===cur); });
  let target = null; zoomRect = null;
  if (s.target){
    if (sel>=0){ target = s.parts[sel].rect; zoomRect = target; place(ring,s.target); ring.style.opacity=1; ring.style.borderColor='#6f75ff'; }
    else { target = s.target; zoomRect = s.target; ring.style.opacity=0; }
    place(spot,target); spot.classList.remove('off');
  } else { spot.classList.add('off'); ring.style.opacity=0; }
  curTarget = target; fit();
  dotsEl.querySelectorAll('.dot').forEach((d,i)=> i===cur ? d.setAttribute('aria-current','step') : d.removeAttribute('aria-current'));
  fill.style.width = ((cur+1)/STEPS.length*100)+'%';
  back.disabled = cur===0;
  next.textContent = cur===STEPS.length-1 ? 'Start over' : 'Next';
}
function go(i){ cur=i; sel=-1; render(); }
back.onclick=()=>go(Math.max(0,cur-1));
next.onclick=()=> cur===STEPS.length-1 ? go(0) : go(cur+1);
document.addEventListener('keydown',e=>{
  if (e.key==='ArrowRight' && cur<STEPS.length-1) go(cur+1);
  if (e.key==='ArrowLeft' && cur>0) go(cur-1);
});
new ResizeObserver(()=>fit()).observe(stage);
render();
</script>
